name: Node.js CI

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install dependencies and Start Bot
      env:
        SESSION_ID: ${{ secrets.SESSION_ID }}
        MODE: ${{ secrets.MODE }}
      run: |
        npm install
        npm start
